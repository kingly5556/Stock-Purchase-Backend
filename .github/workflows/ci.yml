name: CI

on:
  push:
    branches: [main, "experiment/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: k_erp_stock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/k_erp_stock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - name: Typecheck + build
        run: npm run build
      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.INTEGRATION_DATABASE_URL }}
      - name: Unit + integration tests (incl. concurrent PO numbering)
        run: npm test
